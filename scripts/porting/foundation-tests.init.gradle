// Scoped regression tests while unrelated EnderCore sources are being ported.
// This does not alter/skip the normal compileJava or test tasks and is not a
// replacement for the full test suite. Remove the isolation once it is unneeded.
allprojects {
    afterEvaluate { project ->
        if (project.path == ':endercore') {
            def classes = layout.buildDirectory.dir('port-foundation-tests/classes')
            def compileTests = tasks.register('compilePortFoundationTests', JavaCompile) {
                source files(
                    'src/main/java/com/enderio/core/common/serialization/OrderedListCodec.java',
                    'src/test/java/com/enderio/core/serialization/OrderedListCodecTests.java'
                )
                source fileTree('src/main/java') {
                    include 'com/enderio/core/common/network/codec/*.java'
                    include 'com/enderio/core/common/network/menu/payload/*.java'
                    include 'com/enderio/core/common/network/menu/*SyncSlot.java'
                    include 'com/enderio/core/common/network/menu/SyncSlot.java'
                    include 'com/enderio/core/common/network/menu/ClientboundSyncSlotDataPacket.java'
                    include 'com/enderio/core/common/network/menu/ServerboundSetSyncSlotDataPacket.java'
                    include 'com/enderio/core/common/network/NetworkDataSlot.java'
                    include 'com/enderio/core/common/network/EmitParticlePacket.java'
                }
                source fileTree('src/test/java') { include 'com/enderio/core/network/*.java' }
                classpath = configurations.compileClasspath + configurations.testRuntimeClasspath
                destinationDirectory = classes
                javaCompiler = javaToolchains.compilerFor(java.toolchain)
                options.encoding = 'UTF-8'
            }
            tasks.register('portFoundationTest', Test) {
                dependsOn compileTests
                testClassesDirs = files(classes)
                classpath = files(classes) + configurations.testRuntimeClasspath
                javaLauncher = javaToolchains.launcherFor(java.toolchain)
                workingDir = layout.buildDirectory.dir('port-foundation-tests/runtime').get().asFile
                doFirst { workingDir.mkdirs() }
                useJUnitPlatform()
                filter {
                    includeTestsMatching 'com.enderio.core.serialization.OrderedListCodecTests'
                    includeTestsMatching 'com.enderio.core.network.*'
                }
            }
        }
    }
}
